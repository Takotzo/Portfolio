<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AccordionSkeleton</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

  <link rel="icon" href="/Images/Logos/BatagamesIcon.png" type="">
</head>

<body class="light-blue accordion-size">
<div class="row align-items-center text-center">
  <div class="image-of-work col-6">
    <img src="/Images/ImageFromProjects">
  </div>
  <div class="col-6">
    <h1 class="dark-brown">Title</h1>
    <p class="dark-brown">Abstract</p>
  </div>
</div>
<div class="accordion" id="[name]-panel">
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#[name]-collapse-one" aria-expanded="false" aria-controls="[name]-collapse-one">
        Learn more about what I did
      </button>
    </h2>
    <div id="[name]-collapse-one" class="accordion-collapse collapse" data-bs-parent="#[name]-panel">
      <div class="accordion-body">
        <p>Content</p>
      </div>
    </div>
  </div>
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#[name]-collapse-two" aria-expanded="false" aria-controls="[name]-collapse-two">
        Project Description
      </button>
    </h2>
    <div id="[name]-collapse-two" class="accordion-collapse collapse" data-bs-parent="#[name]-panel">
      <div class="accordion-body">
        <p>Description</p>
      </div>
    </div>
  </div>
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#[name]-collapse-three" aria-expanded="false" aria-controls="[name]-collapse-three">
        Contributors to Project
      </button>
    </h2>
    <div id="[name]-collapse-three" class="accordion-collapse collapse" data-bs-parent="#NumericBlastOFF-panel">
      <div class="accordion-body">
        <p>
          This project was a collaborative effort with valuable contributions from the following team members:
        </p>
        <ul class="no-bullets">
          <li>
            <a href="https://www.linkedin.com/in/inge-seland/" target="_blank" rel="noopener noreferrer">
              Inge Seland
            </a> - Role: <span>Team Lead & Developer</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script src="accordionResizer.js"></script>
</body>
</html>
