<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">

    <article class="container-fluid text-center blue">
        <div  class="row g-2">
            <!-- Numeric BlastOFF Accordion -->
            <div class="col-12 col-lg-6">
                <div class="p-3 container-fluid text-center show-box">
                    <iframe src="../AccordionFiles/NumericBlastOFFAccordion.html" class="accordion-iframe" title="Numeric BlastOFF"></iframe>

            <div class="col-12 col-lg-6">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

<script src="/main.js"></script>
<script>
    fetch('PartOfSites/Footer.html')
        .then(response => response.text())
        .then(data => {document.getElementById('footer-template').innerHTML = data;});
    fetch('PartOfSites/Nav.html')
        .then(response => response.text())
        .then(data => {document.getElementById('nav-template').innerHTML = data;});
